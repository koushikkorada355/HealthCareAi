# ============================================================================
# Production overlay — use:  docker compose -f docker-compose.yml \
#                                     -f docker-compose.prod.yml up --build -d
# Changes vs base: no seed on boot, production env flag, no dev ports for
# postgres/mock-ehr (internal network only).
# ============================================================================
include:
  - docker-compose.yml

services:
  backend:
    environment:
      SEED_ON_STARTUP: "false"
      ENVIRONMENT: production

  postgres:
    ports: []

  mock-ehr:
    ports: []
