# Frontend reverse proxy: static React build + same-origin API passthrough.
# The browser calls /api/* and /health on the same origin (port 5173);
# nginx forwards those to the backend container over the internal network.
server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  # API + backend utilities → backend:8000 (internal Docker DNS)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /health {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  location = /openapi.json {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  location /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # SPA fallback
  location / { try_files $uri /index.html; }
}
